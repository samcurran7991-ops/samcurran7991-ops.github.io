name: Wave 2 setup pictures
on:
  workflow_dispatch:
  push:
    paths: ['tools/thumbs/setup.json', 'tools/thumbs/setup.mjs', 'tools/thumbs/make_setup.py', '.github/workflows/setup-thumbs.yml']
permissions:
  contents: write
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: pip install pillow
      - run: node tools/thumbs/setup.mjs
      - run: python tools/thumbs/make_setup.py
      - name: Save pictures
        run: |
          git config user.name "thumbnail-bot"
          git config user.email "thumbnail-bot@users.noreply.github.com"
          git add thumbs/setup-*.jpg
          git commit -m "Wave 2 setup pictures [skip ci]" || echo "no changes"
          git pull --rebase
          git push
