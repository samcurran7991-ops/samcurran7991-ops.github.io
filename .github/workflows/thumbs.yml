name: Email thumbnails
on:
  workflow_dispatch:
  push:
    paths: ['tools/thumbs/**', '.github/workflows/thumbs.yml']
permissions:
  contents: write
jobs:
  thumbs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: pip install pillow
      - run: sleep 60   # let GitHub Pages publish the latest site first
      - run: node tools/thumbs/shoot.mjs
      - run: python tools/thumbs/make.py
      - name: Save thumbnails
        run: |
          git config user.name "thumbnail-bot"
          git config user.email "thumbnail-bot@users.noreply.github.com"
          git add thumbs/booking-*.jpg
          git commit -m "Booking page thumbnails [skip ci]" || echo "no changes"
          git push
